name: Unity Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.0.43f1
          targetPlatform: Android
          buildMethod: DeltaFire.Editor.DeltaFireBuild.BuildAndroid
          versioning: Semantic
          androidExportType: apk
          androidRelease: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaFire-Android
          path: build/DeltaFire.apk
